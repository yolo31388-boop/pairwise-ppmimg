[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppmimg"
version = "0.1.0"
description = "A tiny pure-stdlib PPM (P3/P6) image processing library"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
ppmimg = "ppmimg.__main__:main"

[tool.setuptools]
packages = ["ppmimg"]
